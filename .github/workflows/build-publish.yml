name: Build e publicar Evolution API (patched)

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-publish.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/imegeinbox/evolution-api-patched:2.3.7
            ghcr.io/imegeinbox/evolution-api-patched:latest
